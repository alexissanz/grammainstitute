<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Classical hero — parchment + Mediterranean dusk -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#3a2f24"/>
      <stop offset="55%" stop-color="#1f1814"/>
      <stop offset="100%" stop-color="#0f0c0a"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e7c873" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#a87841" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1612" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1a1612"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#f5efe1" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ece2c8"/>
      <stop offset="100%" stop-color="#a89a7c"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow -->
  <ellipse cx="800" cy="540" rx="640" ry="320" fill="url(#sun)" opacity="0.7"/>
  <circle cx="800" cy="540" r="92" fill="#e7c873" opacity="0.85"/>
  <circle cx="800" cy="540" r="120" fill="none" stroke="#e7c873" stroke-width="1" opacity="0.35"/>

  <!-- Distant mountain silhouette -->
  <path d="M0,640 L180,520 L320,580 L460,500 L640,560 L820,460 L1000,540 L1180,470 L1360,560 L1500,500 L1600,560 L1600,900 L0,900 Z"
        fill="#0f0c0a" opacity="0.92"/>

  <!-- Classical columns (silhouette, blurred) -->
  <g filter="url(#blur)" opacity="0.85">
    <!-- left column -->
    <rect x="180" y="380" width="48" height="260" fill="url(#col)" opacity="0.6"/>
    <rect x="172" y="360" width="64" height="22" fill="url(#col)" opacity="0.7"/>
    <rect x="178" y="630" width="52" height="18" fill="url(#col)" opacity="0.7"/>
    <!-- middle-left column -->
    <rect x="320" y="340" width="48" height="300" fill="url(#col)" opacity="0.55"/>
    <rect x="312" y="320" width="64" height="22" fill="url(#col)" opacity="0.65"/>
    <rect x="318" y="630" width="52" height="18" fill="url(#col)" opacity="0.65"/>
    <!-- middle-right column -->
    <rect x="1232" y="340" width="48" height="300" fill="url(#col)" opacity="0.55"/>
    <rect x="1224" y="320" width="64" height="22" fill="url(#col)" opacity="0.65"/>
    <rect x="1230" y="630" width="52" height="18" fill="url(#col)" opacity="0.65"/>
    <!-- right column -->
    <rect x="1372" y="380" width="48" height="260" fill="url(#col)" opacity="0.6"/>
    <rect x="1364" y="360" width="64" height="22" fill="url(#col)" opacity="0.7"/>
    <rect x="1370" y="630" width="52" height="18" fill="url(#col)" opacity="0.7"/>
  </g>

  <!-- Ground / foreground -->
  <rect y="640" width="1600" height="260" fill="url(#ground)"/>

  <!-- Greek letter watermark -->
  <text x="1320" y="220" text-anchor="end"
        font-family="Cinzel, Georgia, serif"
        font-size="220" font-weight="700"
        fill="#e7c873" opacity="0.10">Γ</text>

  <!-- Inscription line (subtle) -->
  <text x="800" y="848" text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, serif"
        font-style="italic" font-size="22"
        fill="#e7c873" opacity="0.35">
    γνῶθι σεαυτόν · verba volant, scripta manent
  </text>

  <!-- Gold dust particles -->
  <g fill="#e7c873" opacity="0.6">
    <circle cx="220" cy="120" r="1.2"/>
    <circle cx="380" cy="80"  r="1.5"/>
    <circle cx="520" cy="180" r="1"/>
    <circle cx="940" cy="100" r="1.4"/>
    <circle cx="1180" cy="160" r="1"/>
    <circle cx="1340" cy="240" r="1.2"/>
    <circle cx="640" cy="60"  r="1"/>
    <circle cx="1060" cy="220" r="1.4"/>
  </g>
</svg>
