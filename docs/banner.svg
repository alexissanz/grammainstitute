<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Gramma Institute of Linguistics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7c873"/>
      <stop offset="0.5" stop-color="#c8a44b"/>
      <stop offset="1" stop-color="#a87841"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="312" fill="none" stroke="rgba(231,200,115,0.35)" stroke-width="1"/>
  <rect x="32" y="32" width="1136" height="296" fill="none" stroke="rgba(231,200,115,0.15)" stroke-width="1"/>

  <!-- watermark -->
  <text x="600" y="300" text-anchor="middle" font-family="Didot, 'Bodoni Moda', Georgia, serif" font-size="220" fill="rgba(255,255,255,0.04)" font-weight="700">Γράμμα</text>

  <!-- /gil/ mark -->
  <text x="600" y="150" text-anchor="middle" font-family="Didot, 'Bodoni Moda', Georgia, serif" font-size="96" fill="#ffffff" letter-spacing="2">/gil/</text>

  <!-- divider line -->
  <line x1="380" y1="186" x2="820" y2="186" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="600" cy="186" r="4" fill="url(#gold)"/>

  <!-- title -->
  <text x="600" y="232" text-anchor="middle" font-family="Didot, 'Bodoni Moda', Georgia, serif" font-size="34" fill="#f7f3ea" letter-spacing="10">GRAMMA INSTITUTE</text>
  <text x="600" y="272" text-anchor="middle" font-family="Didot, 'Bodoni Moda', Georgia, serif" font-size="22" fill="#c8a44b" letter-spacing="6" font-style="italic">of Linguistics</text>
</svg>
